<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Wedding Booking Form</title>

    <link rel="stylesheet" href="Style.css">
    <script src="Scripts.js" defer></script>
</head>

<body>

<section class="booking-form">

    <h1>Wedding Booking Form 💍</h1>

    <form id="weddingForm">

        <label>Groom Name</label>
        <input type="text" id="groom" required>

        <label>Bride Name</label>
        <input type="text" id="bride" required>

        <label>Mobile Number</label>
        <input type="tel" id="mobile"
        pattern="[0-9]{10}" required>

        <label>Email</label>
        <input type="email" id="email" required>

        <label>Wedding Date</label>
        <input type="date" id="date" required>

        <label>Wedding Venue</label>
        <select id="venue" required>
            <option value="">Select Venue</option>
            <option>Royal Palace</option>
            <option>Garden</option>
            <option>Marriage Hall</option>
            <option>Traditional Mandap</option>
        </select>

        <label>Wedding Package</label>
        <select id="package" required>
            <option value="">Select Package</option>
            <option>Silver</option>
            <option>Gold</option>
            <option>Premium</option>
        </select>

        <button type="submit">Submit Booking</button>

        <button type="reset">Reset</button>

    </form>

    <div id="result"></div>

</section>

</body>
</html>
